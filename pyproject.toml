[project]
name = "axolotl-rag"
version = "0.1.0"
description = "A RAG application using LangChain, Google Gemini, and ChromaDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.0",
    "langchain-chroma>=0.1.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain>=0.3.0",
    "pydantic>=2.0.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "streamlit>=1.40.0",
]
